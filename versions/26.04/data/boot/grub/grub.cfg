set timeout=5
set default=0
set gfxmode=1920x1080,1600x900,1366x768,1280x800,1024x768,auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

if [ -f /boot/grub/themes/asthel-os/theme.txt ]; then
    set theme=/boot/grub/themes/asthel-os/theme.txt
    export theme
fi

menuentry "AsthelOS 26.04 (Aurora) Live" --class asthel-os --class gnu-linux --class os {
    set theme=
    background_image -m stretch /boot/grub/themes/asthel-os/splash.png
    linux /boot/vmlinuz root=live:CDLABEL=ASTHELOS_26_04 rd.live.image rd.live.dir=live rd.live.squashimg=filesystem.squashfs rd.overlay quiet splash plymouth.ignore-serial-consoles loglevel=3
    initrd /boot/initrd.img
}

menuentry "AsthelOS 26.04 (Safe Graphics / Nomodeset)" --class asthel-os --class gnu-linux --class os {
    set theme=
    background_image -m stretch /boot/grub/themes/asthel-os/splash.png
    linux /boot/vmlinuz root=live:CDLABEL=ASTHELOS_26_04 rd.live.image rd.live.dir=live rd.live.squashimg=filesystem.squashfs rd.overlay nomodeset quiet splash plymouth.ignore-serial-consoles loglevel=3
    initrd /boot/initrd.img
}

menuentry "AsthelOS 26.04 (Debug & Verbose Mode)" --class asthel-os --class gnu-linux --class os {
    linux /boot/vmlinuz root=live:CDLABEL=ASTHELOS_26_04 rd.live.image rd.live.dir=live rd.live.squashimg=filesystem.squashfs rd.overlay rd.debug systemd.show_status=1 loglevel=7
    initrd /boot/initrd.img
}
